services:

  # ─── Base de données MySQL ──────────────────────────────
  db:
    image: mysql:8.0
    container_name: boncadeau_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Node.js ────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: boncadeau_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env                  # charge JWT_SECRET, SMTP_*, APP_URL, etc.
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    volumes:
      - ./assets/images/bons:/app/uploads/bons
    depends_on:
      db:
        condition: service_healthy

  # ─── Serveur Frontend (nginx) ───────────────────────────
  frontend:
    image: nginx:alpine
    container_name: boncadeau_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # proxy /api/ → api:3001
    depends_on:
      - api

volumes:
  db_data:
